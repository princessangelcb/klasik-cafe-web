<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3382">
  <meta name="description" content="Choose a new password for your KLASIK CAFE account.">
  <title>Update Password | KLASIK CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-back" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    <section class="auth-visual login-visual" aria-label="A calm cafe setting">
      <img src="images/cafe.jpg" data-fallback="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=85" alt="A warm and welcoming cafe interior">
      <div class="auth-visual-shade"></div>
      <a class="brand brand-light" href="index.html"><img class="brand-logo" src="klasik_cafe_logovid_trans.gif" alt="KLASIK CAFE logo"></a>
      <div class="auth-visual-caption"><p>TAKE A MOMENT FOR YOURSELF</p><h2>Good things<br>start here.</h2></div>
      <span class="media-placeholder auth-placeholder" hidden>KLASIK CAFE</span>
    </section>
    <section class="auth-content">
      <div class="auth-card">
        <p class="eyebrow eyebrow-blue"><span></span> ACCOUNT SECURITY</p>
        <h1>Update <em>password</em></h1>
        <p class="auth-subtitle">Choose a new password with at least 8 characters, including letters and numbers.</p>
        <form id="update-password-form" class="auth-form">
          <div class="form-field">
            <label for="new-password">New Password</label>
            <div class="password-wrap">
              <input id="new-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])\S{8,}" aria-describedby="update-password-message" required>
              <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="eye-outline" d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-slash" d="M4 4 20 20"/></svg></button>
            </div>
          </div>
          <div class="form-field">
            <label for="confirm-new-password">Confirm New Password</label>
            <div class="password-wrap">
              <input id="confirm-new-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])\S{8,}" aria-describedby="update-password-message" required>
              <button class="password-toggle" type="button" data-password-toggle="confirm-new-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="eye-outline" d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-slash" d="M4 4 20 20"/></svg></button>
            </div>
          </div>
          <p class="form-message" id="update-password-message" role="status" aria-live="polite"></p>
          <button class="button button-primary button-wide" type="submit">Update password <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch"><a href="login.html">← Back to login</a></p>
      </div>
      <p class="auth-footnote">KLASIK CAFE</p>
    </section>
  </main>
  <script type="module" src="js/update-password.js"></script>
</body>
</html>
