<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3382">
  <meta name="description" content="Reset your KLASIK CAFE account password.">
  <title>Forgot Password | KLASIK CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-back" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    <section class="auth-visual login-visual" aria-label="A calm cafe setting">
      <img src="images/cafe.jpg" data-fallback="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=85" alt="A warm and welcoming cafe interior">
      <div class="auth-visual-shade"></div>
      <a class="brand brand-light" href="index.html"><img class="brand-logo" src="klasik_cafe_logovid_trans.gif" alt="KLASIK CAFE logo"></a>
      <div class="auth-visual-caption"><p>TAKE A MOMENT FOR YOURSELF</p><h2>Good things<br>start here.</h2></div>
      <span class="media-placeholder auth-placeholder" hidden>KLASIK CAFE</span>
    </section>
    <section class="auth-content">
      <div class="auth-card">
        <p class="eyebrow eyebrow-blue"><span></span> ACCOUNT RECOVERY</p>
        <h1>Forgot <em>password?</em></h1>
        <p class="auth-subtitle">Enter the email address linked to your account and we'll send you a password reset link.</p>
        <form id="forgot-password-form" class="auth-form">
          <div class="form-field">
            <label for="reset-email">Email</label>
            <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="forgot-password-message" required>
          </div>
          <p class="form-message" id="forgot-password-message" role="status" aria-live="polite"></p>
          <button class="button button-primary button-wide" type="submit">Send reset link <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch"><a href="login.html">← Back to login</a></p>
        <p class="auth-home-link"><a href="index.html">Explore KLASIK CAFE <span aria-hidden="true">↗</span></a></p>
      </div>
      <p class="auth-footnote">KLASIK CAFE</p>
    </section>
  </main>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
