<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3382">
  <meta name="description" content="KLASIK CAFE password recovery.">
  <title>Forgot Password | KLASIK CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f7f6f2;">
  <div style="width: 100%; max-width: 480px; padding: 40px; background: transparent;">
    
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="klasik_cafe_logovid_trans.gif" alt="KLASIK CAFE logo" style="width: min(220px, 100%); max-height: 70px; object-fit: contain;">
    </div>

    <!-- Form Header -->
    <div style="margin-bottom: 25px;">
      <p class="eyebrow eyebrow-blue" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; color: #1e3382; margin-bottom: 8px;"><span></span> RECOVERY</p>
      <h1 style="font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #1e3382; margin-bottom: 8px;">Forgot <em>password?</em></h1>
      <p style="font-size: 0.95rem; color: #666;">Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    
    <!-- Forgot Password Form -->
    <form id="forgot-password-form" class="admin-form">
      <div style="margin-bottom: 20px;">
        <label for="reset-email" style="display: block; font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 8px;">Email</label>
        <input type="email" id="reset-email" placeholder="you@example.com" required style="width: 100%; padding: 14px 16px; border: 1px solid #dcdcdc; border-radius: 6px; font-size: 1rem; background-color: #f0f4f8; outline: none; transition: border-color 0.2s;">
      </div>

      <button type="submit" class="button button-primary" style="width: 100%; padding: 14px; background-color: #1e3382; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
        Send Reset Link &rarr;
      </button>

      <div style="text-align: center;">
        <a href="login.html" style="font-size: 0.9rem; color: #1e3382; font-weight: 500; text-decoration: none;">&larr; Back to Login</a>
      </div>
    </form>

  </div>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
