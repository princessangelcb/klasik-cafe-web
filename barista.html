<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3382">
  <meta name="description" content="KLASIK CAFE barista dashboard.">
  <title>Barista Dashboard | KLASIK CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/barista.css">
  <script src="js/script.js" defer></script>
  <script src="js/dashboard-menu.js" defer></script>
</head>
<body class="barista-body">
  <div class="barista-shell">
    <aside class="barista-sidebar">
      <div class="sidebar-brand">
        <img class="brand-logo" src="klasik_cafe_logo_3_-removebg-preview.png" alt="KLASIK CAFE logo">
        <button class="dashboard-menu-toggle" type="button" aria-expanded="false" aria-controls="barista-sidebar-navigation">Menu <span aria-hidden="true">☰</span></button>
      </div>
      <nav class="sidebar-nav" id="barista-sidebar-navigation" aria-label="Barista navigation">
        <a href="#barista-dashboard" class="active">Dashboard</a>
        <a href="#barista-orders" data-order-filter="Pending">Pending</a>
        <a href="#barista-orders" data-order-filter="Preparing">Preparing</a>
        <a href="#barista-orders" data-order-filter="Ready for Pickup">Ready for Pickup</a>
        <a href="#barista-orders" data-order-filter="Completed">Completed</a>
      </nav>
      <section id="barista-menu-status" class="barista-sidebar-menu-status" aria-labelledby="barista-menu-status-title">
        <div class="sidebar-menu-heading"><span>MENU STATUS</span><strong id="barista-menu-status-title">Product Availability</strong></div>
        <p class="barista-menu-help">Changes sync with the live menu.</p>
        <div class="barista-menu-table-wrap"><table class="barista-menu-table"><thead><tr><th>Product</th><th>Availability</th><th>Best Seller</th></tr></thead><tbody id="barista-menu-status-list"><tr><td colspan="3">Loading menu items...</td></tr></tbody></table></div>
      </section>
      <a class="sidebar-logout" href="login.html">Log Out</a>
    </aside>

    <main class="barista-main">
      <header class="barista-topbar">
        <div>
          <p class="eyebrow eyebrow-blue"><span></span> BARISTA PANEL</p>
          <h1>Dashboard</h1>
        </div>
      </header>

      <section id="barista-dashboard" class="stats-grid">
        <article class="stat-card">
          <span>Pending</span>
          <strong id="barista-awaiting-count">0</strong>
        </article>
        <article class="stat-card">
          <span>Preparing</span>
          <strong id="barista-preparing-count">0</strong>
        </article>
        <article class="stat-card">
          <span>Ready for Pickup</span>
          <strong id="barista-ready-count">0</strong>
        </article>
        <article class="stat-card">
          <span>Completed</span>
          <strong id="barista-completed-count">0</strong>
        </article>
      </section>

      <section id="barista-orders" class="panel barista-panel">
        <div class="section-header compact-header">
          <div>
            <p class="eyebrow eyebrow-blue"><span></span> ORDER QUEUE</p>
            <h2>Incoming <em>Orders</em></h2>
          </div>
        </div>

        <div class="barista-layout">
          <div id="barista-order-queue" class="order-queue"></div>
          <aside id="barista-order-detail" class="detail-panel"></aside>
        </div>
      </section>

    </main>
  </div>
  <script type="module" src="js/auth-check.js"></script>
  <script type="module" src="js/barista-menu.js"></script>
  <script type="module" src="js/barista.js"></script>
</body>
</html>
